<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>コネクトジム岩倉店 LINE友だち追加</title>
<script>
  var CONFIG={GTM_ID:'GTM-TRT6D4WM',LIFF_ID:'2011776887-NbFlhEnq',OA_ID:'@187yloih',STORE:'iwakura'};
  window.dataLayer=window.dataLayer||[];
  (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;
  j.src='https://www.googletagmanager.com/gtm.js?id='+i;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer',CONFIG.GTM_ID);
</script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
.box{padding:24px;max-width:360px}.hide{display:none}
.btn{display:inline-block;margin-top:16px;padding:14px 28px;background:#06c755;color:#fff;border-radius:999px;text-decoration:none;font-weight:bold}
</style></head>
<body><div class="box">
  <div id="loading"><p>LINEを開いています…</p></div>
  <div id="fallback" class="hide"><p id="msg">下のボタンから、LINEで友だち追加してください。</p>
  <a id="addBtn" class="btn" href="#">LINEで友だち追加する</a></div>
</div>
<script>
(function(){
  var addUrl='https://line.me/R/ti/p/'+encodeURIComponent(CONFIG.OA_ID);
  var chatUrl='https://line.me/R/oaMessage/'+encodeURIComponent(CONFIG.OA_ID)+'/';
  document.getElementById('addBtn').href=addUrl;
  function fallback(t){document.getElementById('loading').classList.add('hide');
    document.getElementById('fallback').classList.remove('hide');if(t)document.getElementById('msg').textContent=t;}
  var KEY='cg_friend_sent_'+CONFIG.STORE, moved=false;
  function go(){if(!moved){moved=true;location.replace(chatUrl);}}
  function sent(){try{return localStorage.getItem(KEY)==='1'}catch(e){return false}}
  var LOG_URL='https://script.google.com/macros/s/AKfycbyUlO4zQUOY3DBWMZNY50jOzZLV29bO0xHgFNY-1M-GEVAl2-j5zchZhQtCrcbrKVqc/exec';
  // 友だち追加の記録（LINEのユーザーID・表示名と gclid を照合用のシートへ。広告媒体には送らない）
  function logAdd(done){
    var LK='cg_logged_'+CONFIG.STORE;
    try{if(localStorage.getItem(LK)==='1'){done();return;}}catch(e){}
    var q=new URLSearchParams(location.search);
    liff.getProfile().then(function(p){
      var b=JSON.stringify({type:'friend_added',store:CONFIG.STORE,userId:p.userId,displayName:p.displayName,
        gclid:q.get('gclid')||'',fbclid:q.get('fbclid')||'',utm_source:q.get('utm_source')||'',utm_campaign:q.get('utm_campaign')||''});
      try{navigator.sendBeacon(LOG_URL,new Blob([b],{type:'text/plain'}));localStorage.setItem(LK,'1');}catch(e){}
    }).catch(function(){}).then(done);
  }
  function fire(){
    if(sent()){go();return;}
    try{localStorage.setItem(KEY,'1')}catch(e){}
    window.dataLayer.push({event:'line_friend_added',store:CONFIG.STORE,eventCallback:function(){setTimeout(go,800)},eventTimeout:2000});
    setTimeout(go,2500);
  }
  // LINEアプリの外（Instagram・Facebookのアプリ内ブラウザ、Safari等）ではログインさせず、
  // lin.ee と同じ友だち追加画面へ直接移動する（ログイン画面での離脱を防ぐ。追加数は Webhook 側で集計）
  var mobile=/iPhone|iPad|Android/i.test(navigator.userAgent);
  function outside(){if(mobile){location.replace(addUrl);}else{fallback();}}
  if(!window.liff){outside();return;}
  liff.init({liffId:CONFIG.LIFF_ID}).then(function(){
    if(!liff.isInClient()||!liff.isLoggedIn()){outside();return;}
    return liff.getFriendship().then(function(r){
      if(r.friendFlag){logAdd(fire);}else{fallback('友だち追加がまだのようです。下のボタンから追加してください。');}
    });
  }).catch(outside);
})();
</script></body></html>
